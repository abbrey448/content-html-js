<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .cards{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card{
    text-align: center;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.card video{
    width: 100%;
    border-radius: 10px;
}

    </style>
</head>
<body>

<section id="reels">
    <h2>My Reels</h2>

    <div class="cards">

        <div class="card">
            <video controls width="250">
                <source src="videos/reel1.mp4" type="video/mp4">
            </video>
            <h3>Fashion Reel</h3>
        </div>

        <div class="card">
            <video controls width="250">
                <source src="videos/reel2.mp4" type="video/mp4">
            </video>
            <h3>Travel Reel</h3>
        </div>

        <div class="card">
            <video controls width="250">
                <source src="videos/reel3.mp4" type="video/mp4">
            </video>
            <h3>Photography Reel</h3>
        </div>

    </div>
</section>

</body>
</html>
